<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Pong Game - Retro Neon Edition</title>
  <style>
    :root {
      --neon-blue: #00d9ff;
      --neon-pink: #ff006e;
      --neon-purple: #8338ec;
      --neon-green: #3a86ff;
      --bg: #0a0e27;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Courier New', monospace;
      background: linear-gradient(135deg, #0a0e27 0%, #1a0a3e 50%, #0a0e27 100%);
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(10, 14, 39, 0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .screen-active {
      display: grid;
    }

    .screen-content {
      background: rgba(15, 20, 50, 0.9);
      border: 3px solid var(--neon-blue);
      border-radius: 15px;
      width: min(90vw, 700px);
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 0 30px var(--neon-blue), 0 0 60px rgba(0, 217, 255, 0.3);
    }

    .game-title {
      font-size: clamp(2.5rem, 6vw, 5rem);
      letter-spacing: 0.15em;
      margin-bottom: 10px;
      color: var(--neon-blue);
      text-shadow: 0 0 20px var(--neon-blue), 0 0 40px var(--neon-pink);
      font-weight: bold;
    }

    .game-subtitle {
      color: var(--neon-pink);
      font-size: 1rem;
      margin-bottom: 25px;
      text-shadow: 0 0 10px var(--neon-pink);
      letter-spacing: 0.1em;
    }

    .countdown {
      font-size: 6rem;
      font-weight: bold;
      color: var(--neon-green);
      text-shadow: 0 0 30px var(--neon-green);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }

    .controls-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .control-section {
      background: rgba(51, 56, 100, 0.5);
      border: 2px solid var(--neon-purple);
      border-radius: 10px;
      padding: 15px;
      text-align: left;
      box-shadow: 0 0 15px rgba(131, 56, 236, 0.3);
    }

    .control-section h3 {
      margin-bottom: 8px;
      color: var(--neon-purple);
      text-shadow: 0 0 10px var(--neon-purple);
    }

    .control-section p {
      margin: 4px 0;
      color: #ccc;
      font-size: 0.9rem;
    }

    .settings {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      align-items: center;
      margin: 20px 0 30px;
    }

    .checkbox-label, .difficulty-selector {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
    }

    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    select {
      background: rgba(30, 40, 80, 0.8);
      border: 2px solid var(--neon-green);
      color: var(--neon-green);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 1rem;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 10px var(--neon-green);
      box-shadow: 0 0 10px rgba(58, 134, 255, 0.3);
    }

    .btn {
      border: 2px solid currentColor;
      background: transparent;
      cursor: pointer;
      border-radius: 10px;
      font-family: 'Courier New', monospace;
      transition: all 0.3s ease;
      font-weight: bold;
      letter-spacing: 0.05em;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px currentColor;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-primary {
      background: linear-gradient(45deg, var(--neon-blue), var(--neon-green));
      color: var(--bg);
      padding: 14px 32px;
      font-size: 1.1rem;
      box-shadow: 0 0 25px var(--neon-blue), 0 0 40px rgba(0, 217, 255, 0.4);
    }

    .btn-secondary {
      color: var(--neon-pink);
      padding: 12px 28px;
      font-size: 1rem;
      box-shadow: 0 0 15px var(--neon-pink);
    }

    .btn-small {
      color: var(--neon-purple);
      padding: 10px 16px;
      font-size: 0.9rem;
      box-shadow: 0 0 10px var(--neon-purple);
    }

    .game-container {
      width: min(95vw, 920px);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .scoreboard {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: bold;
      letter-spacing: 0.15em;
      color: var(--neon-green);
      text-shadow: 0 0 20px var(--neon-green), 0 0 40px rgba(58, 134, 255, 0.5);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(180deg, rgba(10, 14, 39, 1), rgba(20, 30, 60, 1));
      border: 4px solid var(--neon-blue);
      border-radius: 15px;
      box-shadow: 0 0 40px var(--neon-blue), 0 0 80px rgba(0, 217, 255, 0.2), inset 0 0 30px rgba(0, 217, 255, 0.1);
    }

    .game-stats {
      display: flex;
      justify-content: space-between;
      color: var(--neon-pink);
      font-size: 0.95rem;
      text-shadow: 0 0 10px var(--neon-pink);
    }

    #finalStats {
      margin: 20px 0 25px;
      font-size: 1.2rem;
      color: var(--neon-green);
      text-shadow: 0 0 15px var(--neon-green);
    }

    .neon-text {
      text-shadow: 0 0 10px currentColor;
    }

    @media (max-width: 650px) {
      .screen-content {
        padding: 30px 20px;
      }

      .settings {
        flex-direction: column;
        gap: 15px;
      }

      .game-header {
        flex-direction: column;
        align-items: center;
      }

      .scoreboard {
        width: 100%;
        text-align: center;
      }

      .btn-small {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- Start Screen -->
  <div id="startScreen" class="screen screen-active">
    <div class="screen-content">
      <h1 class="game-title">⚡ PONG ⚡</h1>
      <p class="game-subtitle">RETRO NEON EDITION</p>

      <div class="controls-info">
        <div class="control-section">
          <h3>🖱️ DESKTOP</h3>
          <p><strong>Paddle:</strong> Mouse + ⬆️⬇️</p>
          <p><strong>AI:</strong> Right Side</p>
        </div>
        <div class="control-section">
          <h3>📱 MOBILE</h3>
          <p><strong>Paddle:</strong> Touch</p>
          <p><strong>AI:</strong> Right Side</p>
        </div>
      </div>

      <div class="settings">
        <label class="checkbox-label">
          <input type="checkbox" id="soundToggle" checked />
          <span>🔊 SOUND</span>
        </label>
        <div class="difficulty-selector">
          <label>DIFFICULTY:</label>
          <select id="difficultySelect">
            <option value="easy">EASY</option>
            <option value="normal" selected>NORMAL</option>
            <option value="hard">HARD</option>
            <option value="extreme">EXTREME</option>
          </select>
        </div>
      </div>

      <button class="btn btn-primary" onclick="startGame()">▶ START GAME</button>
    </div>
  </div>

  <!-- Countdown Screen -->
  <div id="countdownScreen" class="screen">
    <div class="screen-content">
      <div class="countdown" id="countdownDisplay">3</div>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="gameScreen" class="screen">
    <div class="game-container">
      <div class="game-header">
        <div class="scoreboard">
          <span id="left-score">0</span> : <span id="right-score">0</span>
        </div>
        <button class="btn btn-small" onclick="pauseGame()">⏸️ PAUSE</button>
      </div>
      <canvas id="game" width="900" height="500"></canvas>
      <div class="game-stats">
        <span id="ball-speed">SPEED: 0</span>
        <span id="game-fps">FPS: 60</span>
      </div>
    </div>
  </div>

  <!-- Pause Screen -->
  <div id="pauseScreen" class="screen">
    <div class="screen-content">
      <h2 class="game-title">⏸ PAUSED</h2>
      <button class="btn btn-primary" onclick="resumeGame()" style="margin: 20px 10px;">▶ RESUME</button>
      <button class="btn btn-secondary" onclick="goToMenu()">🏠 MENU</button>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOverScreen" class="screen">
    <div class="screen-content">
      <h2 class="game-title">⚔ GAME OVER</h2>
      <div id="finalStats"></div>
      <button class="btn btn-primary" onclick="startGame()" style="margin: 15px 10px;">🔄 PLAY AGAIN</button>
      <button class="btn btn-secondary" onclick="goToMenu()">🏠 MENU</button>
    </div>
  </div>

  <script>
    // Audio System
    const AudioSystem = {
      play(type) {
        if (!document.getElementById("soundToggle")?.checked) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;

        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "square";
        osc.connect(gain);
        gain.connect(ctx.destination);

        const sounds = {
          paddle: { freq: 260, dur: 0.06, vol: 0.05 },
          wall: { freq: 180, dur: 0.04, vol: 0.03 },
          score: { freq: 520, dur: 0.15, vol: 0.06 },
          start: { freq: 880, dur: 0.2, vol: 0.06 },
          countdown: { freq: 440, dur: 0.1, vol: 0.05 },
          gameover: { freq: 100, dur: 0.4, vol: 0.07 }
        };

        const sound = sounds[type] || sounds.paddle;
        osc.frequency.value = sound.freq;
        gain.gain.value = sound.vol;
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + sound.dur);
        osc.stop(ctx.currentTime + sound.dur);
        setTimeout(() => ctx.close(), sound.dur * 1000 + 50);
      }
    };

    // Particle System
    const particles = [];
    class Particle {
      constructor(x, y, vx, vy, color, life) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.life = life;
        this.maxLife = life;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.1;
        this.life--;
      }
      draw(ctx) {
        ctx.fillStyle = this.color.replace(")", `, ${this.life / this.maxLife})`);
        ctx.fillRect(this.x, this.y, 3, 3);
      }
    }

    function createParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count;
        const vx = Math.cos(angle) * (Math.random() * 4 + 2);
        const vy = Math.sin(angle) * (Math.random() * 4 + 2);
        particles.push(new Particle(x, y, vx, vy, color, 60));
      }
    }

    // Game Logic
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const UI = {
      left: document.getElementById("left-score"),
      right: document.getElementById("right-score"),
      speed: document.getElementById("ball-speed"),
      fps: document.getElementById("game-fps"),
      stats: document.getElementById("finalStats"),
      countdown: document.getElementById("countdownDisplay")
    };

    const SCREENS = {
      start: document.getElementById("startScreen"),
      game: document.getElementById("gameScreen"),
      countdown: document.getElementById("countdownScreen"),
      pause: document.getElementById("pauseScreen"),
      over: document.getElementById("gameOverScreen")
    };

    const DIFFICULTY = {
      easy: 0.06,
      normal: 0.12,
      hard: 0.18,
      extreme: 0.25
    };

    let gameState = "menu";
    let frameTime = 0;
    let fps = 60;

    const paddle = {
      left: { x: 20, y: 190, w: 14, h: 120, score: 0, speed: 9 },
      right: { x: 866, y: 190, w: 14, h: 120, score: 0 }
    };

    const ball = {
      x: 450,
      y: 250,
      r: 8,
      vx: 5,
      vy: 4
    };

    const keys = { ArrowUp: false, ArrowDown: false };
    let mouseY = 250;

    function clamp(v, min, max) {
      return Math.min(Math.max(v, min), max);
    }

    function setScreen(name) {
      Object.values(SCREENS).forEach(s => s.classList.remove("screen-active"));
      if (SCREENS[name]) SCREENS[name].classList.add("screen-active");
    }

    function startCountdown() {
      gameState = "countdown";
      setScreen("countdown");
      let count = 3;
      UI.countdown.textContent = count;
      AudioSystem.play("countdown");

      const interval = setInterval(() => {
        count--;
        if (count > 0) {
          UI.countdown.textContent = count;
          AudioSystem.play("countdown");
        } else {
          clearInterval(interval);
          gameState = "playing";
          setScreen("game");
          AudioSystem.play("start");
        }
      }, 1000);
    }

    window.startGame = function() {
      paddle.left.score = 0;
      paddle.right.score = 0;
      paddle.left.y = 190;
      paddle.right.y = 190;
      ball.x = 450;
      ball.y = 250;
      ball.vx = 5;
      ball.vy = 4;
      UI.left.textContent = 0;
      UI.right.textContent = 0;
      startCountdown();
    };

    window.pauseGame = function() {
      if (gameState !== "playing") return;
      gameState = "paused";
      setScreen("pause");
    };

    window.resumeGame = function() {
      if (gameState !== "paused") return;
      gameState = "playing";
      setScreen("game");
    };

    window.goToMenu = function() {
      gameState = "menu";
      setScreen("start");
    };

    function endGame() {
      gameState = "over";
      const winner = paddle.left.score > paddle.right.score ? "🏆 PLAYER WINS!" : "🤖 AI WINS!";
      UI.stats.innerHTML = `
        <div style="margin: 15px 0;"><strong>FINAL SCORE:</strong></div>
        <div style="font-size: 1.8rem; margin: 10px 0; color: #3a86ff; text-shadow: 0 0 15px #3a86ff;">
          ${paddle.left.score} - ${paddle.right.score}
        </div>
        <div style="margin: 15px 0; color: #ff006e; text-shadow: 0 0 10px #ff006e;">${winner}</div>
      `;
      setScreen("over");
      AudioSystem.play("gameover");
    }

    function updatePaddles() {
      if (keys.ArrowUp) {
        paddle.left.y -= paddle.left.speed;
      } else if (keys.ArrowDown) {
        paddle.left.y += paddle.left.speed;
      } else {
        const targetY = clamp(mouseY - 60, 0, canvas.height - paddle.left.h);
        paddle.left.y += (targetY - paddle.left.y) * 0.3;
      }
      paddle.left.y = clamp(paddle.left.y, 0, canvas.height - paddle.left.h);

      const diff = document.getElementById("difficultySelect").value;
      const targetY = ball.y - paddle.right.h / 2;
      paddle.right.y += (targetY - paddle.right.y) * DIFFICULTY[diff];
      paddle.right.y = clamp(paddle.right.y, 0, canvas.height - paddle.right.h);
    }

    function updateBall() {
      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.y - ball.r <= 0 || ball.y + ball.r >= canvas.height) {
        ball.vy *= -1;
        ball.y = clamp(ball.y, ball.r, canvas.height - ball.r);
        AudioSystem.play("wall");
        createParticles(ball.x, ball.y, "rgba(0, 217, 255", 8);
      }

      if (ball.x - ball.r <= paddle.left.x + paddle.left.w && ball.x > paddle.left.x &&
          ball.y >= paddle.left.y && ball.y <= paddle.left.y + paddle.left.h && ball.vx < 0) {
        const hit = (ball.y - (paddle.left.y + paddle.left.h / 2)) / (paddle.left.h / 2);
        ball.x = paddle.left.x + paddle.left.w + ball.r;
        ball.vx = Math.abs(ball.vx) * 1.05;
        ball.vy = hit * 8;
        AudioSystem.play("paddle");
        createParticles(ball.x, ball.y, "rgba(255, 0, 110", 12);
      }

      if (ball.x + ball.r >= paddle.right.x && ball.x < paddle.right.x + paddle.right.w &&
          ball.y >= paddle.right.y && ball.y <= paddle.right.y + paddle.right.h && ball.vx > 0) {
        const hit = (ball.y - (paddle.right.y + paddle.right.h / 2)) / (paddle.right.h / 2);
        ball.x = paddle.right.x - ball.r;
        ball.vx = -Math.abs(ball.vx) * 1.05;
        ball.vy = hit * 8;
        AudioSystem.play("paddle");
        createParticles(ball.x, ball.y, "rgba(131, 56, 236", 12);
      }

      if (ball.x < 0) {
        paddle.right.score++;
        AudioSystem.play("score");
        createParticles(450, 250, "rgba(58, 134, 255", 20);
        UI.right.textContent = paddle.right.score;
        if (paddle.right.score >= 5) endGame();
        else { ball.x = 450; ball.y = 250; ball.vx = 5; ball.vy = (Math.random() - 0.5) * 6; }
      }
      if (ball.x > canvas.width) {
        paddle.left.score++;
        AudioSystem.play("score");
        createParticles(450, 250, "rgba(58, 134, 255", 20);
        UI.left.textContent = paddle.left.score;
        if (paddle.left.score >= 5) endGame();
        else { ball.x = 450; ball.y = 250; ball.vx = -5; ball.vy = (Math.random() - 0.5) * 6; }
      }

      UI.speed.textContent = `SPEED: ${Math.round(Math.abs(ball.vx) * 10) / 10}`;
    }

    function draw() {
      ctx.fillStyle = "rgba(10, 14, 39, 0.1)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid background
      ctx.strokeStyle = "rgba(0, 217, 255, 0.05)";
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 40) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
      }
      for (let i = 0; i < canvas.height; i += 40) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Center line
      ctx.strokeStyle = "rgba(0, 217, 255, 0.15)";
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 10]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Paddles
      ctx.fillStyle = "rgba(255, 0, 110, 0.8)";
      ctx.shadowColor = "#ff006e";
      ctx.shadowBlur = 15;
      ctx.fillRect(paddle.left.x, paddle.left.y, paddle.left.w, paddle.left.h);

      ctx.fillStyle = "rgba(131, 56, 236, 0.8)";
      ctx.shadowColor = "#8338ec";
      ctx.fillRect(paddle.right.x, paddle.right.y, paddle.right.w, paddle.right.h);

      // Ball
      ctx.fillStyle = "rgba(0, 217, 255, 1)";
      ctx.shadowColor = "#00d9ff";
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if (particles[i].life <= 0) particles.splice(i, 1);
      }
    }

    let lastTime = performance.now();
    let frameCount = 0;
    function gameLoop(time) {
      frameCount++;
      if (time - lastTime >= 1000) {
        fps = frameCount;
        UI.fps.textContent = `FPS: ${fps}`;
        frameCount = 0;
        lastTime = time;
      }

      if (gameState === "playing") {
        updatePaddles();
        updateBall();
      }
      draw();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", e => {
      if (["ArrowUp", "ArrowDown"].includes(e.key)) e.preventDefault();
      if (e.key in keys) keys[e.key] = true;
      if (e.key === " " && gameState === "playing") pauseGame();
    });

    document.addEventListener("keyup", e => {
      if (e.key in keys) keys[e.key] = false;
    });

    canvas.addEventListener("mousemove", e => {
      const rect = canvas.getBoundingClientRect();
      mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
    });

    canvas.addEventListener("touchmove", e => {
      const rect = canvas.getBoundingClientRect();
      mouseY = (e.touches[0].clientY - rect.top) * (canvas.height / rect.height);
    });

    setScreen("start");
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
