<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ping Pong Arcade Cabinet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="cabinet-shell">
    <div class="cabinet-bezel">
      <div class="screen-wrapper">
        <div id="loadingScreen" class="screen active">
          <div class="loading-core">
            <div class="arcade-logo">PONG</div>
            <div class="loading-bar">
              <div class="loading-progress"></div>
            </div>
            <div class="loading-text">YÜKLENİYOR...</div>
          </div>
        </div>

        <div id="menuScreen" class="screen">
          <div class="menu-box panel">
            <div class="menu-topbar">
              <h1 class="arcade-title">PING PONG</h1>
              <div class="lang-switcher">
                <button class="lang-btn active" data-lang="tr">TR</button>
                <button class="lang-btn" data-lang="en">EN</button>
              </div>
            </div>

            <div class="menu-buttons">
              <button class="action-btn primary" id="startBtn">OYNA</button>
              <button class="action-btn" id="themeBtn">TEMA</button>
              <button class="action-btn" id="settingsBtn">AYARLAR</button>
            </div>

            <div class="theme-panel hidden" id="themePanel">
              <div class="theme-grid">
                <button class="theme-card active" data-theme="space">
                  <span class="theme-name">UZAY</span>
                  <span class="theme-preview space"></span>
                </button>
                <button class="theme-card" data-theme="forest">
                  <span class="theme-name">ORMAN</span>
                  <span class="theme-preview forest"></span>
                </button>
                <button class="theme-card" data-theme="cyber">
                  <span class="theme-name">CYBER</span>
                  <span class="theme-preview cyber"></span>
                </button>
                <button class="theme-card" data-theme="egypt">
                  <span class="theme-name">MISIR</span>
                  <span class="theme-preview egypt"></span>
                </button>
                <button class="theme-card" data-theme="ocean">
                  <span class="theme-name">DENIZ</span>
                  <span class="theme-preview ocean"></span>
                </button>
              </div>
            </div>

            <div class="settings-panel hidden" id="settingsPanel">
              <div class="setting-row">
                <span>SES</span>
                <label class="switch">
                  <input id="soundToggle" type="checkbox" checked />
                  <span class="slider"></span>
                </label>
              </div>
              <div class="setting-row">
                <span>ZORLUK</span>
                <select id="difficultySelect">
                  <option value="easy">KOLAY</option>
                  <option value="normal" selected>NORMAL</option>
                  <option value="hard">ZOR</option>
                  <option value="insane">ÇOK ZOR</option>
                </select>
              </div>
              <div class="setting-row">
                <span>HEDEF</span>
                <select id="targetSelect">
                  <option value="3">3</option>
                  <option value="5" selected>5</option>
                  <option value="7">7</option>
                  <option value="10">10</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div id="gameScreen" class="screen">
          <div class="arcade-hud">
            <div class="hud-pill" id="themeLabel">UZAY</div>
            <div class="hud-pill score-pill"><span id="playerScore">0</span> : <span id="enemyScore">0</span></div>
          </div>
          <canvas id="gameCanvas" width="420" height="760"></canvas>
          <div id="storyToast" class="story-toast"></div>
          <div id="powerPill" class="power-pill"></div>
          <button id="pauseBtn" class="pause-btn">DURAKLAT</button>
        </div>

        <div id="gameOverScreen" class="screen">
          <div class="panel over-panel">
            <div class="over-title">OYUN BİTTİ</div>
            <div class="score-board">
              <div class="result-row"><span>OYUNCU</span><strong id="finalPlayerScore">0</strong></div>
              <div class="result-row"><span>RAKİP</span><strong id="finalEnemyScore">0</strong></div>
            </div>
            <div id="winnerText" class="winner-text">Rakip kazandı.</div>
            <div class="over-actions">
              <button id="retryBtn" class="action-btn primary">YENİDEN OYNA</button>
              <button id="menuBtn" class="action-btn">ANA MENÜ</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="controls-panel">
      <button class="player-btn" id="leftBtn">◀</button>
      <button class="player-btn" id="rightBtn">▶</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
