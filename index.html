<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Pong Game - Mobile Edition</title>
  <style>
    :root {
      --neon-blue: #00d9ff;
      --neon-pink: #ff006e;
      --neon-purple: #8338ec;
      --neon-green: #3a86ff;
      --bg: #0a0e27;
      --text: #ffffff;
      --theme: 'neon';
    }

    body.theme-neon {
      --primary: #00d9ff;
      --secondary: #ff006e;
      --accent: #8338ec;
      --bg-color: #0a0e27;
      --panel-bg: rgba(15, 20, 50, 0.9);
      --glow: 0 0 30px var(--primary), 0 0 60px rgba(0, 217, 255, 0.3);
    }

    body.theme-ocean {
      --primary: #1e90ff;
      --secondary: #00bfff;
      --accent: #00ced1;
      --bg-color: #001a33;
      --panel-bg: rgba(0, 26, 51, 0.9);
      --glow: 0 0 30px var(--primary), 0 0 60px rgba(30, 144, 255, 0.3);
    }

    body.theme-sunset {
      --primary: #ff6b35;
      --secondary: #f7931e;
      --accent: #fdb833;
      --bg-color: #1a0f0f;
      --panel-bg: rgba(50, 25, 20, 0.9);
      --glow: 0 0 30px var(--primary), 0 0 60px rgba(255, 107, 53, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Courier New', monospace;
      background: linear-gradient(135deg, var(--bg-color) 0%, var(--bg-color) 100%);
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(10, 14, 39, 0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
    }

    .screen-active {
      display: grid;
    }

    /* Loading Screen */
    #loadingScreen {
      background: linear-gradient(135deg, var(--bg-color), var(--bg-color));
    }

    .loading-container {
      text-align: center;
    }

    .loading-title {
      font-size: 3rem;
      color: var(--primary);
      text-shadow: 0 0 20px var(--primary);
      margin-bottom: 30px;
      letter-spacing: 0.15em;
    }

    .loading-bar {
      width: 200px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid var(--primary);
      border-radius: 10px;
      margin: 20px auto;
      overflow: hidden;
      box-shadow: 0 0 15px var(--primary);
    }

    .loading-progress {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      width: 0%;
      animation: loading 3s ease-in-out forwards;
      box-shadow: 0 0 10px var(--primary);
    }

    @keyframes loading {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    .loading-text {
      color: var(--text);
      margin-top: 20px;
      font-size: 1rem;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Main Menu */
    .menu-container {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow-y: auto;
    }

    .menu-header {
      padding: 20px 15px;
      text-align: center;
    }

    .menu-title {
      font-size: 2.5rem;
      color: var(--primary);
      text-shadow: 0 0 20px var(--primary);
      margin: 10px 0;
      letter-spacing: 0.1em;
    }

    .menu-content {
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 20px;
      align-items: stretch;
    }

    .menu-button {
      padding: 18px 25px;
      font-size: 1.1rem;
      background: rgba(0, 0, 0, 0.3);
      border: 3px solid var(--primary);
      color: var(--primary);
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 0.05em;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px var(--primary);
      text-shadow: 0 0 10px var(--primary);
    }

    .menu-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px var(--primary), 0 0 40px var(--primary);
    }

    .menu-button:active {
      transform: scale(0.95);
    }

    .menu-footer {
      display: flex;
      justify-content: space-around;
      gap: 10px;
      padding: 15px;
    }

    .icon-button {
      width: 50px;
      height: 50px;
      border: 2px solid var(--accent);
      background: rgba(0, 0, 0, 0.3);
      color: var(--accent);
      border-radius: 8px;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px var(--accent);
    }

    .icon-button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px var(--accent);
    }

    /* Game Screen - Vertical */
    #gameScreen {
      display: none;
      width: 100vw;
      height: 100vh;
      flex-direction: column;
      padding: 10px;
      gap: 10px;
    }

    #gameScreen.screen-active {
      display: flex;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 2px solid var(--primary);
      border-radius: 8px;
    }

    .scoreboard {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--primary);
      text-shadow: 0 0 15px var(--primary);
    }

    .game-canvas-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    canvas {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 85vh;
      background: linear-gradient(180deg, rgba(10, 14, 39, 1), rgba(20, 30, 60, 1));
      border: 3px solid var(--primary);
      border-radius: 10px;
      box-shadow: 0 0 30px var(--primary), inset 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .game-stats {
      display: flex;
      justify-content: space-between;
      padding: 8px 10px;
      color: var(--secondary);
      font-size: 0.85rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
    }

    /* Shop Screen */
    .shop-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px 15px;
      gap: 15px;
      overflow-y: auto;
    }

    .shop-title {
      font-size: 2rem;
      color: var(--primary);
      text-shadow: 0 0 15px var(--primary);
      text-align: center;
      margin-bottom: 10px;
    }

    .theme-selector {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .theme-card {
      background: rgba(0, 0, 0, 0.3);
      border: 3px solid var(--accent);
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .theme-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 25px var(--accent);
    }

    .theme-card.active {
      border-color: var(--primary);
      background: rgba(0, 0, 0, 0.5);
      box-shadow: 0 0 30px var(--primary), 0 0 40px var(--primary);
    }

    .theme-name {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--text);
      margin-bottom: 8px;
    }

    .theme-preview {
      display: flex;
      gap: 8px;
      height: 30px;
      border-radius: 6px;
      overflow: hidden;
    }

    .theme-preview-color {
      flex: 1;
      border-radius: 4px;
      box-shadow: 0 0 10px currentColor;
    }

    .back-button {
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid var(--secondary);
      color: var(--secondary);
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .back-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px var(--secondary);
    }

    /* Settings Screen */
    .settings-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px 15px;
      gap: 20px;
      overflow-y: auto;
    }

    .settings-title {
      font-size: 2rem;
      color: var(--primary);
      text-shadow: 0 0 15px var(--primary);
      text-align: center;
    }

    .settings-group {
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 15px;
      gap: 15px;
    }

    .settings-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .settings-item:last-child {
      border-bottom: none;
    }

    .settings-label {
      font-weight: bold;
      color: var(--text);
    }

    .settings-value {
      color: var(--secondary);
    }

    input[type="checkbox"] {
      width: 30px;
      height: 30px;
      cursor: pointer;
    }

    select {
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid var(--primary);
      color: var(--primary);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 1rem;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      box-shadow: 0 0 10px var(--primary);
    }

    /* Game Over Screen */
    .gameover-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      text-align: center;
      width: 100%;
      height: 100%;
    }

    .gameover-title {
      font-size: 3rem;
      color: var(--secondary);
      text-shadow: 0 0 20px var(--secondary);
      animation: pulse 1s infinite;
    }

    .gameover-stats {
      background: rgba(0, 0, 0, 0.3);
      border: 3px solid var(--primary);
      border-radius: 15px;
      padding: 30px 20px;
      box-shadow: 0 0 30px var(--primary);
      width: 90%;
      max-width: 350px;
    }

    .stat-row {
      font-size: 1.3rem;
      margin: 15px 0;
      color: var(--text);
    }

    .stat-value {
      color: var(--primary);
      font-weight: bold;
      font-size: 1.8rem;
      text-shadow: 0 0 15px var(--primary);
    }

    .gameover-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      padding: 0 20px;
    }

    .gameover-button {
      padding: 15px 30px;
      font-size: 1.1rem;
      background: rgba(0, 0, 0, 0.3);
      border: 3px solid var(--primary);
      color: var(--primary);
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px var(--primary);
    }

    .gameover-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px var(--primary);
    }

    @media (max-width: 768px) {
      .menu-title {
        font-size: 1.8rem;
      }
      
      .menu-button {
        padding: 14px 20px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body class="theme-neon">
  <!-- Loading Screen -->
  <div id="loadingScreen" class="screen screen-active">
    <div class="loading-container">
      <div class="loading-title">⚡ PONG ⚡</div>
      <div class="loading-bar">
        <div class="loading-progress"></div>
      </div>
      <div class="loading-text">Oyun yükleniyor...</div>
    </div>
  </div>

  <!-- Main Menu -->
  <div id="mainMenuScreen" class="screen">
    <div class="menu-container">
      <div class="menu-header">
        <div class="menu-title">⚡ PONG ⚡</div>
      </div>
      
      <div class="menu-content">
        <button class="menu-button" onclick="startCountdown()">▶ OYNA</button>
        <button class="menu-button" onclick="showShop()">🛍 MAĞAZA</button>
        <button class="menu-button" onclick="showSettings()">⚙ AYARLAR</button>
      </div>
      
      <div class="menu-footer">
        <button class="icon-button" onclick="toggleSound()" id="soundBtn">🔊</button>
        <button class="icon-button" onclick="showAbout()">ℹ</button>
      </div>
    </div>
  </div>

  <!-- Game Screen (Vertical) -->
  <div id="gameScreen" class="screen">
    <div class="game-header">
      <span>Oyuncu</span>
      <div class="scoreboard">
        <span id="left-score">0</span> - <span id="right-score">0</span>
      </div>
      <span>Bilgisayar</span>
    </div>
    <div class="game-canvas-container">
      <canvas id="game" width="400" height="600"></canvas>
    </div>
    <div class="game-stats">
      <span id="ball-speed">Hız: 0</span>
      <span id="game-fps">FPS: 60</span>
    </div>
  </div>

  <!-- Countdown Screen -->
  <div id="countdownScreen" class="screen">
    <div style="font-size: 6rem; font-weight: bold; color: var(--primary); text-shadow: 0 0 30px var(--primary); animation: pulse 1s infinite;" id="countdownDisplay">3</div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOverScreen" class="screen">
    <div class="gameover-container">
      <div class="gameover-title">💔 OYUN BİTTİ</div>
      <div class="gameover-stats">
        <div class="stat-row">Son Skor</div>
        <div class="stat-value" id="finalScore">0 - 0</div>
        <div class="stat-row" style="margin-top: 20px;" id="resultText">Oyuncu Kazandı!</div>
      </div>
      <div class="gameover-buttons">
        <button class="gameover-button" onclick="startCountdown()">🔄 YENİDEN OYNA</button>
        <button class="gameover-button" onclick="backToMenu()">🏠 ANA MENÜ</button>
      </div>
    </div>
  </div>

  <!-- Shop Screen -->
  <div id="shopScreen" class="screen">
    <div class="shop-container">
      <div class="shop-title">🛍 TEMA MAĞAZASI</div>
      <div class="theme-selector">
        <div class="theme-card active" id="themeNeon" onclick="selectTheme('neon')">
          <div class="theme-name">Neon</div>
          <div class="theme-preview">
            <div class="theme-preview-color" style="background: #00d9ff; color: #00d9ff;"></div>
            <div class="theme-preview-color" style="background: #ff006e; color: #ff006e;"></div>
            <div class="theme-preview-color" style="background: #8338ec; color: #8338ec;"></div>
          </div>
        </div>

        <div class="theme-card" id="themeOcean" onclick="selectTheme('ocean')">
          <div class="theme-name">Okyanus</div>
          <div class="theme-preview">
            <div class="theme-preview-color" style="background: #1e90ff; color: #1e90ff;"></div>
            <div class="theme-preview-color" style="background: #00bfff; color: #00bfff;"></div>
            <div class="theme-preview-color" style="background: #00ced1; color: #00ced1;"></div>
          </div>
        </div>

        <div class="theme-card" id="themeSunset" onclick="selectTheme('sunset')">
          <div class="theme-name">Gün Batımı</div>
          <div class="theme-preview">
            <div class="theme-preview-color" style="background: #ff6b35; color: #ff6b35;"></div>
            <div class="theme-preview-color" style="background: #f7931e; color: #f7931e;"></div>
            <div class="theme-preview-color" style="background: #fdb833; color: #fdb833;"></div>
          </div>
        </div>
      </div>
      <button class="back-button" onclick="backToMenu()">← GERİ</button>
    </div>
  </div>

  <!-- Settings Screen -->
  <div id="settingsScreen" class="screen">
    <div class="settings-container">
      <div class="settings-title">⚙ AYARLAR</div>
      
      <div class="settings-group">
        <div class="settings-item">
          <span class="settings-label">🔊 Ses Efektleri</span>
          <input type="checkbox" id="soundToggle" checked onchange="toggleSound()">
        </div>
        
        <div class="settings-item">
          <span class="settings-label">Zorluk Seviyesi</span>
          <select id="difficultySelect" onchange="saveDifficulty()">
            <option value="easy">Kolay</option>
            <option value="normal" selected>Normal</option>
            <option value="hard">Zor</option>
            <option value="extreme">Çok Zor</option>
          </select>
        </div>

        <div class="settings-item">
          <span class="settings-label">Hedef Skor</span>
          <select id="targetScore" onchange="saveTargetScore()">
            <option value="3">3 Puan</option>
            <option value="5" selected>5 Puan</option>
            <option value="10">10 Puan</option>
          </select>
        </div>
      </div>
      
      <button class="back-button" onclick="backToMenu()">← GERİ</button>
    </div>
  </div>

  <script>
    // Theme System
    function selectTheme(themeName) {
      document.body.className = `theme-${themeName}`;
      document.querySelectorAll('.theme-card').forEach(card => card.classList.remove('active'));
      document.getElementById(`theme${themeName.charAt(0).toUpperCase() + themeName.slice(1)}`).classList.add('active');
      localStorage.setItem('selectedTheme', themeName);
    }

    // Load saved theme
    const savedTheme = localStorage.getItem('selectedTheme') || 'neon';
    selectTheme(savedTheme);

    // Audio System
    let soundEnabled = localStorage.getItem('soundEnabled') !== 'false';
    document.getElementById('soundToggle').checked = soundEnabled;

    function toggleSound() {
      soundEnabled = !soundEnabled;
      localStorage.setItem('soundEnabled', soundEnabled);
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
    }

    const AudioSystem = {
      play(type) {
        if (!soundEnabled) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;

        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "square";
        osc.connect(gain);
        gain.connect(ctx.destination);

        const sounds = {
          paddle: { freq: 260, dur: 0.06, vol: 0.05 },
          wall: { freq: 180, dur: 0.04, vol: 0.03 },
          score: { freq: 520, dur: 0.15, vol: 0.06 },
          start: { freq: 880, dur: 0.2, vol: 0.06 },
          countdown: { freq: 440, dur: 0.1, vol: 0.05 },
          gameover: { freq: 100, dur: 0.4, vol: 0.07 }
        };

        const sound = sounds[type] || sounds.paddle;
        osc.frequency.value = sound.freq;
        gain.gain.value = sound.vol;
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + sound.dur);
        osc.stop(ctx.currentTime + sound.dur);
        setTimeout(() => ctx.close(), sound.dur * 1000 + 50);
      }
    };

    // Settings Management
    function saveDifficulty() {
      localStorage.setItem('difficulty', document.getElementById('difficultySelect').value);
    }

    function saveTargetScore() {
      localStorage.setItem('targetScore', document.getElementById('targetScore').value);
    }

    // Load saved settings
    const savedDifficulty = localStorage.getItem('difficulty') || 'normal';
    document.getElementById('difficultySelect').value = savedDifficulty;
    const savedTarget = localStorage.getItem('targetScore') || '5';
    document.getElementById('targetScore').value = savedTarget;

    // Screen Management
    function setScreen(name) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('screen-active'));
      document.getElementById(name).classList.add('screen-active');
    }

    function showShop() {
      setScreen('shopScreen');
    }

    function showSettings() {
      setScreen('settingsScreen');
    }

    function showAbout() {
      alert('Pong Oyunu - Mobil Sürüm\n\nRetro tarzında, modern özellikleriyle geliştirilmiş Pong oyunu.\n\n🎮 Eğlenceli Oyunlar!');
    }

    function backToMenu() {
      setScreen('mainMenuScreen');
    }

    // Particle System
    const particles = [];
    class Particle {
      constructor(x, y, vx, vy, color, life) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.life = life;
        this.maxLife = life;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.15;
        this.life--;
      }
      draw(ctx) {
        const alpha = this.life / this.maxLife;
        ctx.fillStyle = this.color.replace(')', `, ${alpha})`);
        ctx.fillRect(this.x, this.y, 4, 4);
      }
    }

    function createParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count;
        const vx = Math.cos(angle) * (Math.random() * 4 + 2);
        const vy = Math.sin(angle) * (Math.random() * 4 + 2);
        particles.push(new Particle(x, y, vx, vy, color, 50));
      }
    }

    // Game Logic
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const styles = getComputedStyle(document.documentElement);
    const colors = {
      primary: styles.getPropertyValue('--primary'),
      secondary: styles.getPropertyValue('--secondary'),
      accent: styles.getPropertyValue('--accent')
    };

    let gameState = 'menu';
    let frameTime = 0;
    let fps = 60;
    let targetScore = parseInt(localStorage.getItem('targetScore') || '5');

    // Paddles (vertical layout)
    const paddle = {
      player: { x: 15, y: 250, w: 60, h: 15, score: 0, speed: 12 },
      ai: { x: 325, y: 250, w: 60, h: 15, score: 0 }
    };

    const ball = {
      x: 200,
      y: 300,
      r: 6,
      vx: 4,
      vy: 4
    };

    let touchX = 200;
    const keys = { ArrowLeft: false, ArrowRight: false };

    function clamp(v, min, max) {
      return Math.min(Math.max(v, min), max);
    }

    function startCountdown() {
      gameState = 'countdown';
      setScreen('countdownScreen');
      let count = 3;
      document.getElementById('countdownDisplay').textContent = count;
      AudioSystem.play('countdown');

      const interval = setInterval(() => {
        count--;
        if (count > 0) {
          document.getElementById('countdownDisplay').textContent = count;
          AudioSystem.play('countdown');
        } else {
          clearInterval(interval);
          gameState = 'playing';
          setScreen('gameScreen');
          AudioSystem.play('start');
          resetGame();
        }
      }, 1000);
    }

    function resetGame() {
      paddle.player.score = 0;
      paddle.ai.score = 0;
      paddle.player.y = 250;
      paddle.ai.y = 250;
      ball.x = 200;
      ball.y = 300;
      ball.vx = 4;
      ball.vy = 4;
      document.getElementById('left-score').textContent = 0;
      document.getElementById('right-score').textContent = 0;
    }

    function updatePaddles() {
      // Player paddle (bottom) - touch/keyboard control
      if (keys.ArrowLeft) {
        paddle.player.x -= paddle.player.speed;
      } else if (keys.ArrowRight) {
        paddle.player.x += paddle.player.speed;
      } else {
        const targetX = clamp(touchX - 30, 0, canvas.width - paddle.player.w);
        paddle.player.x += (targetX - paddle.player.x) * 0.3;
      }
      paddle.player.x = clamp(paddle.player.x, 0, canvas.width - paddle.player.w);

      // AI paddle (top)
      const difficulty = localStorage.getItem('difficulty') || 'normal';
      const aiReaction = { easy: 0.06, normal: 0.12, hard: 0.18, extreme: 0.25 }[difficulty];
      const targetX = ball.x - paddle.ai.w / 2;
      paddle.ai.x += (targetX - paddle.ai.x) * aiReaction;
      paddle.ai.x = clamp(paddle.ai.x, 0, canvas.width - paddle.ai.w);
    }

    function updateBall() {
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Wall collision (left/right)
      if (ball.x - ball.r <= 0 || ball.x + ball.r >= canvas.width) {
        ball.vx *= -1;
        ball.x = clamp(ball.x, ball.r, canvas.width - ball.r);
        AudioSystem.play('wall');
        createParticles(ball.x, ball.y, 'rgba(0, 217, 255', 8);
      }

      // Paddle collision (top - AI)
      if (ball.y - ball.r <= paddle.ai.y + paddle.ai.h &&
          ball.y > paddle.ai.y &&
          ball.x >= paddle.ai.x &&
          ball.x <= paddle.ai.x + paddle.ai.w &&
          ball.vy < 0) {
        const hit = (ball.x - (paddle.ai.x + paddle.ai.w / 2)) / (paddle.ai.w / 2);
        ball.y = paddle.ai.y + paddle.ai.h + ball.r;
        ball.vy = Math.abs(ball.vy) * 1.05;
        ball.vx = hit * 8;
        AudioSystem.play('paddle');
        createParticles(ball.x, ball.y, 'rgba(131, 56, 236', 12);
      }

      // Paddle collision (bottom - Player)
      if (ball.y + ball.r >= paddle.player.y &&
          ball.y < paddle.player.y + paddle.player.h &&
          ball.x >= paddle.player.x &&
          ball.x <= paddle.player.x + paddle.player.w &&
          ball.vy > 0) {
        const hit = (ball.x - (paddle.player.x + paddle.player.w / 2)) / (paddle.player.w / 2);
        ball.y = paddle.player.y - ball.r;
        ball.vy = -Math.abs(ball.vy) * 1.05;
        ball.vx = hit * 8;
        AudioSystem.play('paddle');
        createParticles(ball.x, ball.y, 'rgba(255, 0, 110', 12);
      }

      // Scoring
      if (ball.y < 0) {
        paddle.player.score++;
        AudioSystem.play('score');
        createParticles(200, 300, 'rgba(58, 134, 255', 20);
        document.getElementById('left-score').textContent = paddle.player.score;
        if (paddle.player.score >= targetScore) endGame(true);
        else resetBall();
      }
      if (ball.y > canvas.height) {
        paddle.ai.score++;
        AudioSystem.play('score');
        createParticles(200, 300, 'rgba(58, 134, 255', 20);
        document.getElementById('right-score').textContent = paddle.ai.score;
        if (paddle.ai.score >= targetScore) endGame(false);
        else resetBall();
      }

      document.getElementById('ball-speed').textContent = `Hız: ${Math.round(Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy) * 10) / 10}`;
    }

    function resetBall() {
      ball.x = 200;
      ball.y = 300;
      ball.vx = (Math.random() - 0.5) * 8;
      ball.vy = (Math.random() - 0.5) * 8;
    }

    function endGame(playerWon) {
      gameState = 'over';
      document.getElementById('finalScore').textContent = `${paddle.player.score} - ${paddle.ai.score}`;
      document.getElementById('resultText').textContent = playerWon ? '🎉 Oyuncu Kazandı!' : '🤖 Bilgisayar Kazandı!';
      setScreen('gameOverScreen');
      AudioSystem.play('gameover');
    }

    function draw() {
      // Background
      ctx.fillStyle = 'rgba(10, 14, 39, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid
      const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--primary');
      ctx.strokeStyle = 'rgba(0, 217, 255, 0.05)';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 40) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
      }
      for (let i = 0; i < canvas.height; i += 40) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Center line (dashed)
      ctx.strokeStyle = 'rgba(0, 217, 255, 0.2)';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // Paddles with glow
      ctx.fillStyle = 'rgba(131, 56, 236, 0.8)';
      ctx.shadowColor = '#8338ec';
      ctx.shadowBlur = 15;
      ctx.fillRect(paddle.ai.x, paddle.ai.y, paddle.ai.w, paddle.ai.h);

      ctx.fillStyle = 'rgba(255, 0, 110, 0.8)';
      ctx.shadowColor = '#ff006e';
      ctx.fillRect(paddle.player.x, paddle.player.y, paddle.player.w, paddle.player.h);

      // Ball with glow
      ctx.fillStyle = 'rgba(0, 217, 255, 1)';
      ctx.shadowColor = '#00d9ff';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if (particles[i].life <= 0) particles.splice(i, 1);
      }
    }

    let lastTime = performance.now();
    let frameCount = 0;
    function gameLoop(time) {
      frameCount++;
      if (time - lastTime >= 1000) {
        fps = frameCount;
        document.getElementById('game-fps').textContent = `FPS: ${fps}`;
        frameCount = 0;
        lastTime = time;
      }

      if (gameState === 'playing') {
        updatePaddles();
        updateBall();
      }
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Input handling
    document.addEventListener('keydown', e => {
      if (['ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
      if (e.key in keys) keys[e.key] = true;
    });

    document.addEventListener('keyup', e => {
      if (e.key in keys) keys[e.key] = false;
    });

    canvas.addEventListener('touchmove', e => {
      const rect = canvas.getBoundingClientRect();
      touchX = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
    });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      touchX = (e.clientX - rect.left) * (canvas.width / rect.width);
    });

    // Loading screen transition
    setTimeout(() => {
      setScreen('mainMenuScreen');
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
    }, 3000);

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
